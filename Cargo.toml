[package]
name = "envscan"
version = "0.2.2"
edition = "2021"
license = "MIT"

[dependencies]
aho-corasick = "1"
fancy-regex = "0.14"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
memchr = "2"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The fuzz golden runs 200,000 lines through every shape.
[profile.dev.package."*"]
opt-level = 3
